<title>Cuentas del mes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Flujo: abajo cinco pestañas por tarea. Las listas son de lectura (tocás una fila para editar en una hoja);
   las acciones frecuentes (tildar, pagar, anotar Uber) están a un toque. */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --ink:#151e2c; --muted:#5a6678; --line:#dde3ec; --accent:#2347c5; --accent-s:#e5eafb;
  --good:#17784a; --good-s:#e1f3e9; --bad:#b32217; --bad-s:#fde7e4; --warn:#9a5a00; --warn-s:#fcefd3;
  --inc:#17784a; --inc-s:#e1f3e9; --uber:#b45309; --uber-s:#fdeed3; --debt:#be123c; --debt-s:#fde4ea;
  --fix:#2347c5; --fix-s:#e5eafb; --card:#7c3aed; --card-s:#efe6fd; --dat:#5a6678; --dat-s:#e8ecf2;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --surface:#161d28; --ink:#e7ecf3; --muted:#92a0b4; --line:#273142; --accent:#86a3ff; --accent-s:#1c2744;
    --good:#4cc38a; --good-s:#102e1e; --bad:#ff8c80; --bad-s:#3a1714; --warn:#e8aa4c; --warn-s:#37290e;
    --inc:#4cc38a; --inc-s:#0f2c1d; --uber:#f5a742; --uber-s:#352408; --debt:#ff7a96; --debt-s:#3a1420;
    --fix:#86a3ff; --fix-s:#1a2545; --card:#b794f6; --card-s:#2a1c47; --dat:#92a0b4; --dat-s:#212b3a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --ink:#e7ecf3; --muted:#92a0b4; --line:#273142; --accent:#86a3ff; --accent-s:#1c2744;
  --good:#4cc38a; --good-s:#102e1e; --bad:#ff8c80; --bad-s:#3a1714; --warn:#e8aa4c; --warn-s:#37290e;
  --inc:#4cc38a; --inc-s:#0f2c1d; --uber:#f5a742; --uber-s:#352408; --debt:#ff7a96; --debt-s:#3a1420;
  --fix:#86a3ff; --fix-s:#1a2545; --card:#b794f6; --card-s:#2a1c47; --dat:#92a0b4; --dat-s:#212b3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);
  padding-block:0 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.25rem;margin:0;font-weight:600}
h2{font-size:1.02rem;margin:0;font-weight:600}
h3{font-size:.92rem;margin:0;font-weight:600}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.hint{font-size:.82rem;color:var(--muted)}
input,select,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;width:100%}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:1.5rem;height:1.5rem;accent-color:var(--c,var(--accent));margin:0;cursor:pointer;flex:none}

.head{padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.head-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head-r{display:flex;align-items:center;gap:12px}
.save{font-size:.76rem;color:var(--muted)}
.head-ctrl{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.month strong{min-width:9rem;text-align:center;font-weight:600}
.month button{border:0;background:transparent;border-radius:9px;width:2.5rem;height:2.5rem;font-size:1.3rem;cursor:pointer}
.month button:hover{background:var(--accent-s)}
.rate{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.rate input{width:6.2rem;padding:.5rem .6rem}
.link{border:0;background:transparent;color:var(--c,var(--accent));font-weight:600;cursor:pointer;padding:.25rem 0}

.banner{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:var(--warn-s);border-radius:10px;padding:8px 12px;font-size:.84rem;margin-bottom:12px}
.banner button{border:0;background:transparent;color:var(--warn);font-weight:600;cursor:pointer;padding:0}

main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.sub{font-size:.84rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:500}

/* filas de lectura */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{border:0;background:transparent;text-align:left;padding:0;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .body.static{cursor:default}
.item .nm{font-weight:500;overflow-wrap:anywhere}
.item.done .nm{color:var(--muted);text-decoration:line-through}
.item .meta{font-size:.8rem;color:var(--muted)}
.item .meta.late{color:var(--bad);font-weight:500}.item .meta.ok{color:var(--good)}.item .meta.no{color:var(--bad)}
.item .amt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt small{display:block;font-size:.74rem;color:var(--muted)}
.item .spacer{width:1.5rem}
.ex{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);background:var(--warn-s);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.add{border:1px dashed var(--c,var(--line));background:transparent;border-radius:10px;padding:.7rem;color:var(--c,var(--accent));cursor:pointer;font-weight:600;width:100%}
.add:hover{background:var(--cs,var(--accent-s))}
.empty{font-size:.88rem;color:var(--muted);padding:4px 0}
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.65rem 1rem;cursor:pointer;font-weight:600;text-align:center}
.btn:hover{background:var(--accent-s)}
.btn.pri{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.inl{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.inl input{width:4rem;padding:.35rem .5rem}

/* resumen */
.answer{border-radius:16px;padding:20px;background:var(--surface);border:1px solid var(--line)}
.answer.good{background:var(--good-s);border-color:transparent}.answer.bad{background:var(--bad-s);border-color:transparent}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.headline{font-size:1.5rem;line-height:1.25;font-weight:600;margin-top:4px;text-wrap:balance}
.headline b{font-family:var(--mono);font-weight:500}
.answer.good .headline b{color:var(--good)}.answer.bad .headline b{color:var(--bad)}
.three{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three div{display:flex;flex-direction:column;gap:1px;min-width:0}
.three span{font-size:.74rem;color:var(--muted)}
.three b{font-family:var(--mono);font-weight:500;font-size:.88rem;white-space:nowrap}
.callout{padding:10px 14px;border-radius:10px;background:var(--accent-s);font-size:.92rem}
.callout.ok{background:var(--good-s)}.callout.bad{background:var(--bad-s)}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.pbar{display:grid;grid-template-columns:6.5rem 1fr 3rem;gap:10px;align-items:center;font-size:.86rem}
.pbar span:last-child{text-align:right}
details>summary{cursor:pointer;color:var(--muted);font-size:.86rem;padding:4px 0}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.2rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi span{font-size:.74rem;color:var(--muted)}
.kpi b{font-family:var(--mono);font-weight:500;font-size:1rem;overflow-wrap:anywhere}
.kpi.c b{color:var(--c)}

/* uber */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{padding:.8rem;cursor:pointer;font-weight:600;background:var(--surface);text-align:center}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg label:has(input:checked){background:var(--good);color:var(--surface)}
.seg label.out:has(input:checked){background:var(--bad)}
.seg label.exp:has(input:checked){background:var(--warn);color:var(--surface)}
.seg label{padding:.8rem .3rem;font-size:.9rem}
.seg label:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.big-in{font-size:1.6rem!important;padding:.7rem .8rem!important}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.pair{display:grid;grid-template-columns:1fr 7rem;gap:6px}
.day{border-top:1px solid var(--line);padding:10px 0 4px}
.day:first-of-type{border-top:0}
.day-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}
.day-h b{text-transform:capitalize}
.ent{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto 2.2rem;gap:8px;align-items:center;padding:4px 0;font-size:.92rem}
.ent .t{min-width:0;overflow-wrap:anywhere}.ent .t small{color:var(--muted)}
.tag{font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:99px;text-align:center}
.tag.in{background:var(--good-s);color:var(--good)}.tag.out{background:var(--bad-s);color:var(--bad)}.tag.exp{background:var(--warn-s);color:var(--warn)}.tag.card{background:var(--card-s);color:var(--card)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;width:2.2rem;height:2.2rem;border-radius:8px;cursor:pointer}
.x:hover{background:var(--bad-s);color:var(--bad)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.catrow{display:grid;grid-template-columns:minmax(0,9rem) 1fr auto;gap:10px;align-items:center;font-size:.86rem}

/* deudas */
.kind{font-size:.7rem;font-weight:600;color:var(--c);background:var(--cs);padding:2px 9px;border-radius:99px;white-space:nowrap}
.dtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.dtitle h2{overflow-wrap:anywhere}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--mono);font-size:1.5rem;font-weight:500;color:var(--c);overflow-wrap:anywhere}
.chip{font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:99px;width:max-content}
.chip.ok{background:var(--good-s);color:var(--good)}.chip.wn{background:var(--warn-s);color:var(--warn)}.chip.nn{background:var(--dat-s);color:var(--muted)}
.hrow{display:grid;grid-template-columns:5.6rem minmax(0,1fr) 2.2rem;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.hrow small{color:var(--muted)}

.item.noleft{grid-template-columns:minmax(0,1fr) auto}
.sbar{display:grid;grid-template-columns:minmax(0,9rem) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.sbar .pc{text-align:right;white-space:nowrap}
@media (max-width:420px){.sbar{grid-template-columns:minmax(0,6.6rem) 1fr auto}}
/* navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nv{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 8px;font-size:.66rem;font-weight:500;color:var(--muted);cursor:pointer;min-width:0}
.nv svg{display:block}
.nv[aria-current=page]{color:var(--c);box-shadow:inset 0 3px 0 var(--c)}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:45;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center;font-size:.9rem}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}

/* hoja de edición */
.sheet-ov{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(540px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet form{display:flex;flex-direction:column;gap:12px}
.prev{font-size:.9rem;background:var(--cs,var(--accent-s));border-radius:10px;padding:10px 12px}
.ov{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.ov .box{background:var(--surface);border-radius:14px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px;max-height:100%}
.ov textarea{width:100%;height:42vh;min-height:9rem;font:12px/1.4 var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (min-width:640px){.sheet-ov{align-items:center}.sheet{border-radius:18px}}
@media (max-width:420px){.headline{font-size:1.28rem}.pbar{grid-template-columns:5.2rem 1fr 2.8rem}.ent{grid-template-columns:4.6rem minmax(0,1fr) auto 2.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <div class="head-top"><h1>Cuentas del mes</h1><div class="head-r"><span id="save" class="save" role="status"></span><button class="link" type="button" data-act="tab" data-tab="datos">Datos</button></div></div>
    <div class="head-ctrl">
      <div class="month"><button type="button" data-act="prev" aria-label="Mes anterior">‹</button><strong id="mlabel"></strong><button type="button" data-act="next" aria-label="Mes siguiente">›</button></div>
      <label class="rate" for="rate">Dólar $ <input id="rate" type="number" step="any" inputmode="decimal" title="Pesos por cada dólar. Convierte lo que está en USD."></label>
    </div>
    <p id="mrange" class="hint" hidden></p>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Secciones"><div class="nav-in" id="nav"></div></nav>
<div id="note" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet" class="sheet-ov" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"><div class="sheet-h"><h2 id="sh-title"></h2><button class="x" type="button" data-act="sheet-close" aria-label="Cerrar">×</button></div><div id="sh-body"></div></div></div>

<script>
(function(){
'use strict';
var MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var LS='cuentas-v2';
var SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var NAV=[
  ['resumen','Resumen','accent',SVG+'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 8h6V4h-6z"/></svg>'],
  ['income','Ingresos','inc',SVG+'<path d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg>'],
  ['uber','Hoy','uber',SVG+'<path d="M5 15l1.6-5h10.8L19 15M4 15h16v4H4zM7 19v1.5M17 19v1.5"/></svg>'],
  ['expenses','Gastos','fix',SVG+'<path d="M12 20V8m0 0l-4 4m4-4l4 4M5 4h14"/></svg>'],
  ['debts','Deudas','debt',SVG+'<path d="M3 9l9-5 9 5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>'],
  ['analisis','Análisis','accent',SVG+'<path d="M5 20V11M12 20V4M19 20v-6"/></svg>']
];
var SC={income:'inc',fixed:'fix',card:'card',debts:'debt',uber:'uber'};
var CATS={gasto:['Comida en la calle','Supermercado','Transporte','Salud','Ocio','Ropa','Hogar','Otros'],fijo:['Alquiler','Servicios','Suscripciones','Gimnasio','Teléfono / internet','Cloud / software','Otros fijos'],auto:['Combustible','Peaje / estacionamiento','Lavado','Mantenimiento','Pago alquiler del auto','Multas / otros'],uin:['Viajes','Propinas','Otros ingresos'],ing:['Sueldo','Freelance','Otros']};
var UCAT={in:CATS.uin,out:CATS.auto,exp:CATS.gasto};
var S=null,key='',tab='resumen',dbRef=null,uid=null,loaded=false,saving=false,dirty=false,tmr=null,noteT=null,last=null,uType='in',sheet=null,refocus=false;

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nid(){return Math.random().toString(36).slice(2,9);}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function r2(n){return Math.round(n*100)/100;}
var nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
var nf2=new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
var nf1=new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:1});
function ars(n){return (n<0?'−':'')+'$ '+nf0.format(Math.abs(Math.round(n)));}
function usd(n){return (n<0?'−':'')+'US$ '+nf2.format(Math.abs(n));}
function money(c,n){return c==='USD'?usd(n):(n<0?'−':'')+'$ '+nf2.format(Math.abs(n));}
function toARS(a,c){return c==='USD'?a*num(S.rate):a;}
function pad(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var now=new Date(),todayD=dstr(now),todayKey='';
function shiftKey(k,d){var p=k.split('-').map(Number),y=p[0],m=p[1]+d;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad(m);}
var SHORTM=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function sday(){var n=Math.round(num(S&&S.startDay));return n>=2&&n<=28?n:1;}
function periodKey(ds){var ym=ds.slice(0,7),d=+ds.slice(8,10);return (sday()>1&&d>=sday())?shiftKey(ym,1):ym;}
function dateOf(k,d){var ym=(sday()>1&&d>=sday())?shiftKey(k,-1):k;return ym+'-'+pad(d);}
function st(c){return 'style="--c:var(--'+c+');--cs:var(--'+c+'-s)"';}
function mlab(k){return MONTHS[+k.split('-')[1]-1];}

/* ---------- datos ---------- */
function emptyState(){return {v:4,rate:1555,startDay:27,t:0,months:{},uber:[],debts:[],cards:[],consumos:[],stmts:{},accounts:[],defAcc:'',gastos:[],transfers:[],carDaily:0};}
function normalize(x){
  if(!x||typeof x!=='object'||(x.v||0)<4){var e0=emptyState();e0._rs=1;return e0;}
  x.startDay=x.startDay==null?1:num(x.startDay);
  x.rate=num(x.rate)||1555;x.months=x.months&&typeof x.months==='object'?x.months:{};
  x.uber=Array.isArray(x.uber)?x.uber:[];x.debts=Array.isArray(x.debts)?x.debts:[];x.t=x.t||0;
  x.debts.forEach(function(d){d.payments=Array.isArray(d.payments)?d.payments:[];});
  x.cards=Array.isArray(x.cards)?x.cards:[];x.consumos=Array.isArray(x.consumos)?x.consumos:[];x.stmts=x.stmts&&typeof x.stmts==='object'?x.stmts:{};
  x.accounts=Array.isArray(x.accounts)?x.accounts:[];x.gastos=Array.isArray(x.gastos)?x.gastos:[];x.transfers=Array.isArray(x.transfers)?x.transfers:[];x.defAcc=x.defAcc||'';x.carDaily=num(x.carDaily);
  Object.keys(x.months).forEach(function(k){
    var m=x.months[k];m.income=m.income||[];m.fixed=m.fixed||[];
    if(Array.isArray(m.card)){m.card.forEach(function(c){if(!c.ex)m.fixed.push({id:c.id,name:'Tarjeta: '+(c.name||'consumo'),amt:c.amt,cur:c.cur,day:m.cardDay||'',done:!!c.done});});}
    delete m.card;delete m.cardDay;
  });
  return x;
}
function mo(k){
  var m=S.months[k];
  if(!m){
    var ks=Object.keys(S.months).filter(function(x){return x<k;}).sort(),p=ks.length?S.months[ks[ks.length-1]]:null;
    m=S.months[k]={
      income:p?p.income.map(function(i){return Object.assign({},i,{id:nid(),done:false,ex:0});}):[],
      fixed:p?p.fixed.map(function(i){return Object.assign({},i,{id:nid(),done:false,ex:0});}):[]};
  }
  m.income=m.income||[];m.fixed=m.fixed||[];
  return m;
}

/* ---------- cálculos ---------- */
function uberStats(k){
  var es=S.uber.filter(function(e){return periodKey(e.date)===k;}),inn=0,out=0,days={};
  es.forEach(function(e){if(e.type==='in'){inn+=num(e.amt);days[e.date]=1;}else out+=num(e.amt);});
  var nd=Object.keys(days).length;
  return {es:es,inn:inn,out:out,net:inn-out,days:nd,avg:nd?(inn-out)/nd:0};
}
function loanInfo(d){
  var cap=0,int=0,paid=0;
  d.payments.forEach(function(p){cap+=num(p.capital);int+=num(p.interest);paid+=num(p.paid);});
  var bal=Math.max(0,num(d.principal)-cap),mr=num(d.rate)/100/(d.ratePer==='y'?12:1);
  return {cap:cap,int:int,paid:paid,bal:bal,mr:mr,nextInt:bal*mr};
}
function fixedInfo(d){
  var n=d.payments.length,tot=num(d.total),left=tot>0?Math.max(0,tot-n):null;
  return {n:n,tot:tot,left:left,remain:left==null?null:left*num(d.amount)};
}
function paidIn(d,k){return d.payments.filter(function(p){return periodKey(p.date)===k;}).reduce(function(a,p){return a+num(p.paid);},0);}
function debtEntries(k){
  var out=[];
  S.debts.forEach(function(d){
    var paid=paidIn(d,k),amt=0,done=false;
    if(paid>0){amt=paid;done=true;}
    else if(d.kind==='loan'){if(num(d.planned)>0&&loanInfo(d).bal>0)amt=num(d.planned);}
    else{var fi=fixedInfo(d);if(num(d.amount)>0&&(fi.left==null||fi.left>0))amt=num(d.amount);}
    if(amt>0)out.push({sec:'debts',debt:d.id,label:d.name||'Deuda',ars:toARS(amt,d.cur),orig:d.cur==='USD'?amt:null,day:num(d.day)||99,done:done,ord:0});
  });
  return out;
}
function dueCal(c,ds){var p=ds.split('-').map(Number),ck=p[0]+'-'+pad(p[1]);if(p[2]>num(c.closeDay))ck=shiftKey(ck,1);return num(c.dueDay)>num(c.closeDay)?ck:shiftKey(ck,1);}
function dueKeyFor(c,ds){return periodKey(dueCal(c,ds)+'-'+pad(num(c.dueDay)||1));}
function stmtOf(c,k){
  var items=S.consumos.filter(function(x){return x.cardId===c.id&&dueKeyFor(c,x.date)===k;});
  var reg=items.reduce(function(a,x){return a+toARS(num(x.amt),x.cur);},0);
  var st0=S.stmts[c.id+'|'+k]||{},real=num(st0.real);
  return {card:c,k:k,items:items,reg:reg,real:real,toPay:real>0?real:reg,paid:!!st0.paid};
}
function entries(k){
  var m=mo(k),out=debtEntries(k),nk=shiftKey(k,1),nm=S.months[nk];
  function fx(f,mk){out.push({sec:'fixed',id:f.id,mk:mk,early:mk!==k,label:f.name||'Gasto fijo',ars:toARS(num(f.amt),f.cur),orig:f.cur==='USD'?num(f.amt):null,day:num(f.day)||99,done:!!f.done,ord:1});}
  m.fixed.forEach(function(f){if(!f.early)fx(f,k);});
  if(nm)nm.fixed.forEach(function(f){if(f.early)fx(f,nk);});
  S.cards.forEach(function(c){var s=stmtOf(c,k);if(s.toPay>0)out.push({sec:'card',cardId:c.id,label:c.name||'Tarjeta',ars:s.toPay,orig:null,day:num(c.dueDay)||99,done:s.paid,ord:2});});
  out.forEach(function(x){x.dt=x.day===99?'9999-99-99':dateOf(k,x.day);});
  return out;
}
function accOf(x){return x.acc||S.defAcc||'';}
function flowsAll(){
  var f=[];
  S.uber.forEach(function(e){if(e.ts)f.push({acc:accOf(e),amt:(e.type==='in'?1:-1)*num(e.amt),ts:e.ts});});
  S.gastos.forEach(function(g){if(g.ts)f.push({acc:accOf(g),amt:-num(g.amt),ts:g.ts});});
  Object.keys(S.months).forEach(function(k){var m=S.months[k];
    m.income.forEach(function(i){if(i.done&&i.doneAt)f.push({acc:accOf(i),amt:toARS(num(i.amt),i.cur),ts:i.doneAt});});
    m.fixed.forEach(function(x){if(x.done&&x.doneAt)f.push({acc:accOf(x),amt:-toARS(num(x.amt),x.cur),ts:x.doneAt});});});
  S.debts.forEach(function(d){d.payments.forEach(function(p){if(p.ts)f.push({acc:accOf(p),amt:-toARS(num(p.paid),d.cur),ts:p.ts});});});
  Object.keys(S.stmts).forEach(function(k){var s=S.stmts[k];if(s.paid&&s.paidAt)f.push({acc:accOf(s),amt:-num(s.amt),ts:s.paidAt});});
  S.transfers.forEach(function(t){f.push({acc:t.from,amt:-num(t.amt),ts:t.ts},{acc:t.to,amt:num(t.amt),ts:t.ts});});
  return f;
}
function accBal(a){var b=num(a.base),fl=flowsAll();fl.forEach(function(f){if(f.acc===a.id&&f.ts>=num(a.baseAt))b+=f.amt;});return b;}
function accTotal(){var fl=flowsAll();return S.accounts.reduce(function(s,a){var b=num(a.base);fl.forEach(function(f){if(f.acc===a.id&&f.ts>=num(a.baseAt))b+=f.amt;});return s+b;},0);}
function uberReal(k){
  var es=S.uber.filter(function(e){return periodKey(e.date)===k;}),by={},inn=0,out=0,fuel=0;
  es.forEach(function(e){var a=num(e.amt),d=by[e.date]=by[e.date]||{in:0,out:0};
    if(e.type==='in'){inn+=a;d.in+=a;}else if(e.cat!=='Pago alquiler del auto'){out+=a;d.out+=a;if(e.cat==='Combustible')fuel+=a;}});
  var ds=Object.keys(by).sort(),nd=ds.filter(function(x){return by[x].in>0;}).length,car=num(S.carDaily)*nd;
  var rows=ds.map(function(x){var c=by[x].in>0?num(S.carDaily):0;return {date:x,in:by[x].in,out:by[x].out,car:c,profit:by[x].in-by[x].out-c};});
  var profit=inn-out-car;
  return {inn:inn,out:out,fuel:fuel,car:car,profit:profit,days:nd,perDay:nd?profit/nd:0,fuelDay:nd?fuel/nd:0,rows:rows};
}
function dayStats(ds){
  var inn=0,out=0;
  S.uber.forEach(function(e){if(e.date!==ds)return;var a=num(e.amt);if(e.type==='in')inn+=a;else if(e.cat!=='Pago alquiler del auto')out+=a;});
  var car=inn>0?num(S.carDaily):0;return {in:inn,out:out,car:car,profit:inn-out-car};
}
function dayItems(k){
  var L=[];
  S.uber.forEach(function(e){if(periodKey(e.date)===k)L.push({date:e.date,ts:e.ts||0,kind:e.type,id:e.id,cat:e.cat,note:e.note,amt:num(e.amt)});});
  S.gastos.forEach(function(g){if(periodKey(g.date)===k)L.push({date:g.date,ts:g.ts||0,kind:'exp',id:g.id,cat:g.cat,note:g.name,amt:num(g.amt)});});
  S.consumos.forEach(function(c){if(periodKey(c.date)===k){var cd=S.cards.filter(function(x){return x.id===c.cardId;})[0];L.push({date:c.date,ts:0,kind:'card',id:c.id,cat:c.cat||'Tarjeta',note:(cd?cd.name:'')+(c.name?' · '+c.name:''),amt:toARS(num(c.amt),c.cur)});}});
  return L;
}
function spendByCat(k){
  var m={},tot=0;function add(c,a){if(!(a>0))return;m[c]=(m[c]||0)+a;tot+=a;}
  S.gastos.forEach(function(g){if(periodKey(g.date)===k)add(g.cat||'Otros',num(g.amt));});
  S.consumos.forEach(function(c){if(periodKey(c.date)===k)add(c.cat||'Tarjeta sin categoría',toARS(num(c.amt),c.cur));});
  (S.months[k]?S.months[k].fixed:[]).forEach(function(f){if(!f.early)add(f.cat||'Gastos fijos sin categoría',toARS(num(f.amt),f.cur));});
  S.uber.forEach(function(e){if(e.type==='out'&&e.cat!=='Pago alquiler del auto'&&periodKey(e.date)===k)add('Auto: '+e.cat,num(e.amt));});
  add('Auto: cuota del alquiler',uberReal(k).car);
  S.debts.forEach(function(d){d.payments.forEach(function(p){if(periodKey(p.date)===k)add('Intereses de deudas',toARS(num(p.interest),d.cur));});});
  return {m:m,tot:tot};
}
function openingOf(k){
  var m=S.months[k];
  if(m&&m.opening!=null&&m.opening!=='')return num(m.opening);
  var ks=Object.keys(S.months).filter(function(x){return x<k;}).sort();
  return ks.length?totals(ks[ks.length-1]).close:0;
}
function totals(k){
  var m=mo(k),e=entries(k),u=uberStats(k),incAll=0,incIn=0,expAll=0,expPaid=0,op=openingOf(k);
  m.income.forEach(function(i){var a=toARS(num(i.amt),i.cur);incAll+=a;if(i.done)incIn+=a;});
  var salIn=incIn,salAll=incAll;incAll+=u.net;incIn+=u.net;
  e.forEach(function(x){expAll+=x.ars;if(x.done)expPaid+=x.ars;});
  if(k===todayKey&&S.accounts.length)op=accTotal()-(incIn-expPaid);
  return {e:e,u:u,opening:op,salIn:salIn,salAll:salAll,incAll:incAll,incIn:incIn,incPend:incAll-incIn,expAll:expAll,expPaid:expPaid,expDue:expAll-expPaid,cash:op+incIn-expPaid,close:op+incAll-expAll};
}
function orderList(k,t){
  var items=t.e.filter(function(x){return !x.done;}).map(function(x){return Object.assign({},x);});
  items.sort(function(a,b){return a.dt<b.dt?-1:a.dt>b.dt?1:a.ord-b.ord;});
  var run=t.cash;
  items.forEach(function(x){run-=x.ars;x.short=Math.max(0,-run);x.covered=run>=-0.5;});
  return items;
}
function whenTxt(dt){
  if(dt==='9999-99-99')return {t:'sin fecha',late:false};
  var p=dt.split('-'),s=(+p[2])+' '+SHORTM[+p[1]-1],late=false;
  if(key===todayKey){
    var diff=Math.round((new Date(dt+'T12:00:00')-new Date(todayD+'T12:00:00'))/864e5);
    if(diff<0){s+=' · venció hace '+(-diff)+' d';late=true;}else if(diff===0)s+=' · vence hoy';else if(diff<=7)s+=' · en '+diff+' d';
  }
  return {t:s,late:late};
}
function secOf(sec){var xs=totals(key).e.filter(function(x){return x.sec===sec;}),tot=0,pd=0;xs.forEach(function(x){tot+=x.ars;if(x.done)pd+=x.ars;});return {tot:tot,pd:pd};}

/* ---------- guardado ---------- */
function setSave(t){var e=$('#save');if(e)e.textContent=t;}
function persist(){
  S.t=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  dirty=true;setSave(dbRef?'Guardando…':'Guardado');
  clearTimeout(tmr);tmr=setTimeout(flush,800);
}
async function flush(){
  if(!loaded||!dbRef){setSave('Guardado');return;}
  if(saving){clearTimeout(tmr);tmr=setTimeout(flush,400);return;}
  saving=true;
  try{while(dirty){dirty=false;await dbRef.collection('data/users/'+uid).doc('app').set(JSON.parse(JSON.stringify(S)));}setSave('Guardado');}
  catch(e){dirty=true;setSave('Sin nube: copia solo en este navegador');}
  finally{saving=false;}
}
function note(html,ms){var n=$('#note');n.innerHTML=html;n.hidden=false;clearTimeout(noteT);noteT=setTimeout(function(){n.hidden=true;},ms||5000);}

/* ---------- piezas de vista ---------- */
function amtHtml(cur,a){return cur==='USD'?usd(a)+'<small>≈ '+ars(a*num(S.rate))+'</small>':ars(a);}
function cardHead(c,title,right){return '<div class="card-h"><h2><span class="dot"></span>'+title+'</h2>'+(right||'')+'</div>';}
function itemRow(sec,it,mk){
  mk=mk||key;
  var pre=(sec==='fixed'&&mk!==key)?'De '+mlab(mk).toLowerCase()+' · ':'',meta,late=false,cls='';
  if(sec==='income'){meta=it.done?'Cobrado':'Por cobrar';cls=it.done?'ok':'';}
  else{if(it.done){meta='Pagado';cls='ok';}else{var w=whenTxt(num(it.day)?dateOf(mk,num(it.day)):'9999-99-99');meta=w.t;late=w.late;}}
  return '<div class="item'+(it.done?' done':'')+'" data-sec="'+sec+'" data-id="'+it.id+'" data-mk="'+mk+'">'
    +'<input type="checkbox" class="chk" data-act="toggle"'+(it.done?' checked':'')+' aria-label="'+(sec==='income'?'Cobrado':'Pagado')+'">'
    +'<button class="body" type="button" data-act="edit"><span class="nm">'+esc(it.name||'Sin nombre')+(it.ex?'<span class="ex">ejemplo</span>':'')+'</span><span class="meta'+(late?' late':'')+(cls?' '+cls:'')+'">'+esc(pre+meta)+'</span></button>'
    +'<div class="amt">'+amtHtml(it.cur,num(it.amt))+'</div></div>';
}
function entryRow(x,cov){
  var w=whenTxt(x.dt),meta=w.t,late=w.late,cls='',pre=(x.sec==='fixed'&&x.early)?'De '+mlab(x.mk).toLowerCase()+' · ':'';
  if(x.done){meta='Pagado';late=false;cls='ok';}
  else if(cov){if(cov.covered){meta+=' · cubierto';}else{meta+=' · faltan '+ars(cov.short);cls='no';}}
  var left,edit;
  if(x.sec==='fixed'){
    left='<input type="checkbox" class="chk" data-act="toggle" data-sec="fixed" data-id="'+x.id+'" data-mk="'+x.mk+'"'+(x.done?' checked':'')+' aria-label="Pagado">';
    edit='<button class="body" type="button" data-act="edit" data-sec="fixed" data-id="'+x.id+'" data-mk="'+x.mk+'">';
  }else if(x.sec==='debts'){
    left='<input type="checkbox" class="chk" data-act="pay-entry" data-debt="'+x.debt+'"'+(x.done?' checked disabled':'')+' aria-label="Registrar pago">';
    edit='<button class="body" type="button" data-act="go" data-tab="debts">';
  }else{
    left='<input type="checkbox" class="chk" data-act="toggle-stmt" data-card="'+x.cardId+'"'+(x.done?' checked':'')+' aria-label="Resumen pagado">';
    edit='<button class="body" type="button" data-act="go" data-tab="expenses">';
  }
  return '<div class="item'+(x.done?' done':'')+'" '+st(SC[x.sec])+'>'+left+edit+'<span class="nm"><span class="dot"></span> '+esc(x.label)+'</span><span class="meta'+(late?' late':'')+(cls?' '+cls:'')+'">'+esc(pre+meta)+'</span></button>'
    +'<div class="amt">'+ars(x.ars)+(x.orig!=null?'<small>'+usd(x.orig)+'</small>':'')+'</div></div>';
}

/* ---------- pestañas ---------- */

    call='<div class="callout bad">Lo primero: conseguí <b class="num">'+ars(first.short)+'</b> para <b>'+esc(first.label)+'</b> ('+whenTxt(first.dt).t+'), contando solo lo ya cobrado.'+cover+'</div>';
  }
  var done=t.e.filter(function(x){return x.done;});
  h+='<section class="card" '+st('accent')+'>'+cardHead('accent','Por pagar','<span class="sub"><b class="num">'+ars(t.expDue)+'</b></span>')+call
    +(items.length?'<div class="list">'+items.map(function(x){return entryRow(x,x);}).join('')+'</div>':'')
    +(done.length?'<details><summary>Ya pagado ('+done.length+')</summary><div class="list">'+done.map(function(x){return entryRow(x);}).join('')+'</div></details>':'')+'</section>';
  var pend=mo(key).income.filter(function(i){return !i.done;});

  var pi=t.incAll>0?Math.round(t.incIn/t.incAll*100):0,pe=t.expAll>0?Math.round(t.expPaid/t.expAll*100):0;
  h+='<section class="card">'+cardHead('accent','Cómo vas')
    +'<div class="pbar" '+st('inc')+'><span>Cobrado</span><div class="bar"><i style="width:'+pi+'%"></i></div><span class="num">'+pi+'%</span></div>'
    +'<div class="pbar" '+st('fix')+'><span>Pagado</span><div class="bar"><i style="width:'+pe+'%"></i></div><span class="num">'+pe+'%</span></div></section>';
  return h;
}
function vIncome(){
  var m=mo(key),t=totals(key);
  return '<section class="card" '+st('inc')+'>'+cardHead('inc','Sueldo e ingresos fijos','<span class="sub"><b class="num">'+ars(t.salIn)+'</b> de <b class="num">'+ars(t.salAll)+'</b></span>')

function payVals(form){
  var d=S.debts.filter(function(x){return x.id===sheet.id;})[0],li=loanInfo(d),fd=new FormData(form);

}

  }else if(sheet.kind==='consumo'){

    if(cd&&ds){var dk=dueCal(cd,ds);el.innerHTML='Va al resumen de <b>'+esc(cd.name)+'</b> que vence el <b>'+esc(cd.dueDay)+' de '+mlab(dk).toLowerCase()+'</b>.';}else el.textContent='';
  }else if(sheet.kind==='stmt'){

  }
}
function submitSheet(form){
  var fd=new FormData(form),c=sheet;
  if(c.kind==='item'){
    var home=c.mk||key;if(!c.id&&c.sec==='fixed'&&fd.get('when')==='next')home=shiftKey(key,1);
    var list=mo(home)[c.sec],it=c.id?list.filter(function(x){return x.id===c.id;})[0]:null,name=String(fd.get('name')||'').trim();
    if(!name){note('Poné un concepto.');return;}
    var data={name:name,amt:num(fd.get('amt')),cur:fd.get('cur')||'ARS',cat:fd.get('cat')||'',acc:fd.get('acc')||''};
    if(c.sec==='fixed')data.day=fd.get('day')===''?'':num(fd.get('day'));
    if(!c.id&&home!==key)data.early=true;
    if(it){Object.assign(it,data);it.ex=0;}else{list.push(Object.assign({id:nid(),done:false},data));}
    if(!c.id&&home!==key)note('Quedó como pago de '+mlab(home).toLowerCase()+' que hacés este mes.');
  }else if(c.kind==='debt'){
    var name2=String(fd.get('name')||'').trim();if(!name2){note('Poné un nombre.');return;}
    var d=c.id?S.debts.filter(function(x){return x.id===c.id;})[0]:null,k=d?d.kind:c.dkind,nd={name:name2,cur:fd.get('cur')||'ARS',day:fd.get('day')===''?'':num(fd.get('day'))};
    if(k==='loan'){nd.who=String(fd.get('who')||'').trim();nd.principal=num(fd.get('principal'));nd.rate=num(fd.get('rate'));nd.ratePer=fd.get('ratePer')||'m';nd.planned=num(fd.get('planned'));}
    else{nd.amount=num(fd.get('amount'));nd.total=fd.get('total')===''?'':num(fd.get('total'));}
    if(d){Object.assign(d,nd);d.ex=0;}else S.debts.push(Object.assign({id:nid(),kind:k,payments:[]},nd));
  }else if(c.kind==='payloan'){
    var v=payVals(form);if(!(v.paid>0)){note('Poné el monto que pagaste.');return;}
    v.d.payments.push({id:nid(),date:v.date,paid:r2(v.interest+v.capital),interest:r2(v.interest),capital:r2(v.capital),acc:fd.get('acc')||'',ts:Date.now()});
    var pk0=periodKey(v.date);if(pk0!==key&&pk0>=todayKey)key=pk0;
    note('Pago registrado. Saldo: '+money(v.d.cur,v.left)+'.');
  }else if(c.kind==='payfixed'){
    var dd=S.debts.filter(function(x){return x.id===c.id;})[0],paid=num(fd.get('paid'));
    if(!(paid>0)){note('Poné el monto pagado.');return;}
    dd.payments.push({id:nid(),date:fd.get('date')||todayD,paid:paid,acc:fd.get('acc')||'',ts:Date.now()});note('Cuota registrada.');
  }else if(c.kind==='cash'){
    var t=totals(key);mo(key).opening=r2(num(fd.get('cash'))-(t.cash-t.opening));note('Plata de hoy actualizada.');
  }else if(c.kind==='card'){
    var cn0=String(fd.get('name')||'').trim(),cl=num(fd.get('closeDay')),du=num(fd.get('dueDay'));
    if(!cn0||cl<1||cl>31||du<1||du>31){note('Poné nombre, cierre y vencimiento (días del 1 al 31).');return;}
    var cd=c.id?S.cards.filter(function(x){return x.id===c.id;})[0]:null;
    if(cd){cd.name=cn0;cd.closeDay=cl;cd.dueDay=du;cd.ex=0;}else S.cards.push({id:nid(),name:cn0,closeDay:cl,dueDay:du});
  }else if(c.kind==='consumo'){
    var amt=num(fd.get('amt')),cdd=S.cards.filter(function(x){return x.id===fd.get('card');})[0];
    if(!(amt>0)||!cdd){note('Poné tarjeta y un monto mayor a cero.');return;}
    var cx={cardId:cdd.id,date:fd.get('date')||todayD,name:String(fd.get('name')||'').trim(),amt:amt,cur:fd.get('cur')||'ARS',cat:fd.get('cat')||''};
    var ex0=c.id?S.consumos.filter(function(x){return x.id===c.id;})[0]:null;
    if(ex0){Object.assign(ex0,cx);ex0.ex=0;}else S.consumos.push(Object.assign({id:nid()},cx));
    note('Va al resumen de '+cdd.name+' que vence el '+cdd.dueDay+' de '+mlab(dueCal(cdd,cx.date)).toLowerCase()+'.');
  }else if(c.kind==='stmt'){
    var sk=c.cardId+'|'+key,so=S.stmts[sk]=S.stmts[sk]||{};so.real=fd.get('real')===''?'':num(fd.get('real'));so.acc=fd.get('acc')||'';
  }else if(c.kind==='account'){
    var an=String(fd.get('name')||'').trim();if(!an){note('Poné un nombre.');return;}
    var bal=num(fd.get('bal')),ac=c.id?S.accounts.filter(function(x){return x.id===c.id;})[0]:null;
    if(ac){ac.name=an;ac.base=bal;ac.baseAt=Date.now();if(fd.get('def')==='1')S.defAcc=ac.id;}
    else{var na={id:nid(),name:an,base:bal,baseAt:Date.now()};S.accounts.push(na);if(!S.defAcc||fd.get('def')==='1')S.defAcc=na.id;}
  }else if(c.kind==='transfer'){
    var tf=fd.get('from'),tt=fd.get('to'),ta=num(fd.get('amt'));
    if(tf===tt||!(ta>0)){note('Elegí dos cuentas distintas y un monto mayor a cero.');return;}
    S.transfers.push({id:nid(),from:tf,to:tt,amt:ta,note:String(fd.get('note')||'').trim(),ts:Date.now()});note('Transferencia registrada.');
  }
  closeSheet();persist();render();
}

async function saveFile(name,text,mime){
  if(window.claude&&window.claude.use){
    var dl=null;try{dl=await window.claude.use('downloads');}catch(e){}
    if(dl){try{await dl.save({filename:name,data:text});note('Archivo listo: '+esc(name));return;}catch(e){if(e&&e.code==='declined')return;}}
    showText(name,text);return;
  }
  try{
    var url=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'})),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},2000);note('Descargando '+esc(name));
  }catch(e){showText(name,text);}
}
function importFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{var x=JSON.parse(fr.result);if(!x||typeof x!=='object'||!x.months||!Array.isArray(x.debts))throw new Error('formato');S=normalize(x);persist();render();note('Respaldo importado.');}
    catch(e){note('Ese archivo no parece un respaldo de esta página.');}
  };
  fr.readAsText(file);
}

/* ---------- eventos ---------- */
function debtOf(el){var c=el.closest('[data-debt]');return c?S.debts.filter(function(d){return d.id===c.dataset.debt;})[0]:null;}
function secId(el){var r=el.closest('[data-id]')||el;return {sec:r.dataset.sec,id:r.dataset.id,mk:r.dataset.mk||key};}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='rate'){S.rate=num(t.value);persist();if(tab!=='uber')render();return;}
  if(t.dataset&&t.dataset.m){mo(key)[t.dataset.m]=t.value===''?'':num(t.value);persist();return;}
  if(t.closest&&t.closest('#sform')&&sheet&&['payloan','consumo','stmt'].indexOf(sheet.kind)>=0){updPrev();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='imp'){if(t.files&&t.files[0])importFile(t.files[0]);t.value='';return;}
  if(t.id==='startDay'){S.startDay=Math.min(28,Math.max(1,Math.round(num(t.value))||1));todayKey=periodKey(todayD);key=todayKey;persist();render();return;}
  if(t.name==='utype'){uType=t.value;fillUForm();return;}
  if(t.id==='carDaily'){S.carDaily=num(t.value);persist();render();return;}
  if(t.dataset&&t.dataset.m){render();return;}
  if(t.dataset&&t.dataset.act==='toggle'){
    var r=secId(t),it=mo(r.mk)[r.sec].filter(function(x){return x.id===r.id;})[0];if(!it)return;
    it.done=t.checked;it.doneAt=t.checked?Date.now():0;persist();render();
  }
});
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='sform'){e.preventDefault();submitSheet(f);return;}
  if(f.id!=='uform')return;
  e.preventDefault();
  var amt=num($('#u-amt').value),date=$('#u-date').value||todayD,cat=$('#u-cat').value,med=$('#u-med').value,nt=$('#u-note').value.trim();
  if(!(amt>0)){note('Poné un monto mayor a cero.');$('#u-amt').focus();return;}
  var msg;
  if(uType==='exp'&&med.indexOf('card:')===0){
    var cd=S.cards.filter(function(x){return x.id===med.slice(5);})[0];
    S.consumos.push({id:nid(),cardId:cd.id,date:date,name:nt||cat,cat:cat,amt:amt,cur:'ARS'});
    msg='Gasto con '+cd.name+' anotado: va al resumen que vence el '+cd.dueDay+' de '+mlab(dueCal(cd,date)).toLowerCase()+'.';
  }else if(uType==='exp'){S.gastos.push({id:nid(),date:date,cat:cat,name:nt,amt:amt,acc:med,ts:Date.now()});msg='Gasto anotado: '+ars(amt);}
  else{S.uber.push({id:nid(),date:date,type:uType,cat:cat,amt:amt,note:nt,acc:med,ts:Date.now()});msg=(uType==='in'?'Ingreso':'Gasto del auto')+' anotado: '+ars(amt);}
  key=periodKey(date);
  persist();refocus=true;render();note(msg);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet)closeSheet();});
function go(d){key=shiftKey(key,d);mo(key);render();}
document.addEventListener('click',function(e){
  if(e.target.id==='sheet'){closeSheet();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act;
  if(act==='tab'||act==='go'){tab=b.dataset.tab;render();window.scrollTo(0,0);return;}
  if(act==='prev')return go(-1);
  if(act==='next')return go(1);
  if(act==='sheet-close')return closeSheet();
  if(act==='add')return itemSheet(b.dataset.sec,null);
  if(act==='edit'){var r=secId(b);return itemSheet(r.sec,r.id,r.mk);}
  if(act==='add-card')return cardSheet(null);
  if(act==='edit-card')return cardSheet(b.closest('[data-card]').dataset.card);
  if(act==='add-consumo')return consumoSheet(null,b.dataset.card||null);
  if(act==='edit-consumo')return consumoSheet(b.closest('[data-cid]').dataset.cid,null);
  if(act==='stmt-sheet')return stmtSheet(b.dataset.card);
  if(act==='set-cash')return cashSheet();
  if(act==='add-account')return accountSheet(null);
  if(act==='edit-account')return accountSheet(b.dataset.acc);
  if(act==='transfer')return transferSheet();
  if(act==='toggle-stmt'){var sk=b.dataset.card+'|'+key,so=S.stmts[sk]=S.stmts[sk]||{},cd0=S.cards.filter(function(x){return x.id===b.dataset.card;})[0];if(!so.paid){so.paid=true;so.paidAt=Date.now();so.amt=stmtOf(cd0,key).toPay;}else{so.paid=false;so.paidAt=0;}persist();render();return;}
  if(act==='add-loan')return debtSheet(null,'loan');
  if(act==='add-fixed')return debtSheet(null,'fixed');
  if(act==='edit-debt')return debtSheet(debtOf(b).id);
  if(act==='pay-loan'){var dl=debtOf(b);return payLoanSheet(dl.id);}
  if(act==='pay-fixed'){var df=debtOf(b);return payFixedSheet(df.id);}
  if(act==='pay-entry'){e.preventDefault();var dd=S.debts.filter(function(x){return x.id===b.dataset.debt;})[0];if(!dd)return;return dd.kind==='loan'?payLoanSheet(dd.id):payFixedSheet(dd.id);}
  if(act==='sheet-del'){
    var c=sheet;
    if(c.kind==='item'){var arr=mo(c.mk)[c.sec],ix=arr.findIndex(function(x){return x.id===c.id;});if(ix>=0){last={k:'item',key:c.mk,sec:c.sec,item:arr[ix],ix:ix};arr.splice(ix,1);}}
    else if(c.kind==='debt'){var di=S.debts.findIndex(function(x){return x.id===c.id;});if(di>=0){last={k:'debt',item:S.debts[di],ix:di};S.debts.splice(di,1);}}
    else if(c.kind==='consumo'){var ci=S.consumos.findIndex(function(x){return x.id===c.id;});if(ci>=0){last={k:'consumo',item:S.consumos[ci],ix:ci};S.consumos.splice(ci,1);}}
    else if(c.kind==='card'){
      var ki=S.cards.findIndex(function(x){return x.id===c.id;});
      if(ki>=0){var cs=S.consumos.filter(function(x){return x.cardId===c.id;}),sts={};Object.keys(S.stmts).forEach(function(k2){if(k2.indexOf(c.id+'|')===0){sts[k2]=S.stmts[k2];delete S.stmts[k2];}});last={k:'card',item:S.cards[ki],ix:ki,cons:cs,sts:sts};S.consumos=S.consumos.filter(function(x){return x.cardId!==c.id;});S.cards.splice(ki,1);}
    }
    else if(c.kind==='account'){var ai=S.accounts.findIndex(function(x){return x.id===c.id;});if(ai>=0){last={k:'account',item:S.accounts[ai],ix:ai,def:S.defAcc};S.accounts.splice(ai,1);if(S.defAcc===c.id)S.defAcc=S.accounts[0]?S.accounts[0].id:'';}}
    else if(c.kind==='stmt'){var sk2=c.cardId+'|'+key;if(S.stmts[sk2])S.stmts[sk2].real='';}
    closeSheet();persist();render();note(c.kind==='stmt'?'Quité el monto del resumen.':'Eliminado. <button type="button" data-act="undo">Deshacer</button>',8000);return;
  }
  if(act==='del-uber'){
    var id3=b.closest('[data-uid]').dataset.uid,i3=S.uber.findIndex(function(x){return x.id===id3;});if(i3<0)return;
    last={k:'uber',item:S.uber[i3],ix:i3};S.uber.splice(i3,1);persist();render();
    note('Quitaste un movimiento. <button type="button" data-act="undo">Deshacer</button>',8000);return;
  }
  if(act==='del-gasto'){
    var gid=b.closest('[data-gid]').dataset.gid,gi=S.gastos.findIndex(function(x){return x.id===gid;});if(gi<0)return;
    last={k:'gasto',item:S.gastos[gi],ix:gi};S.gastos.splice(gi,1);persist();render();note('Quitaste un gasto. <button type="button" data-act="undo">Deshacer</button>',8000);return;
  }
  if(act==='del-pay'){
    var dp=debtOf(b),pid=b.closest('[data-pid]').dataset.pid,pi=dp.payments.findIndex(function(x){return x.id===pid;});if(pi<0)return;
    last={k:'pay',debt:dp.id,item:dp.payments[pi],ix:pi};dp.payments.splice(pi,1);persist();render();
    note('Quitaste un pago. <button type="button" data-act="undo">Deshacer</button>',8000);return;
  }
  if(act==='undo'){
    if(!last)return;
    if(last.k==='item')mo(last.key)[last.sec].splice(last.ix,0,last.item);
    else if(last.k==='uber')S.uber.splice(last.ix,0,last.item);
    else if(last.k==='debt')S.debts.splice(last.ix,0,last.item);
    else if(last.k==='consumo')S.consumos.splice(last.ix,0,last.item);
    else if(last.k==='gasto')S.gastos.splice(last.ix,0,last.item);
    else if(last.k==='account'){S.accounts.splice(last.ix,0,last.item);S.defAcc=last.def;}
    else if(last.k==='card'){S.cards.splice(last.ix,0,last.item);S.consumos=S.consumos.concat(last.cons);Object.assign(S.stmts,last.sts);}
    else if(last.k==='pay'){var d2=S.debts.filter(function(x){return x.id===last.debt;})[0];if(d2)d2.payments.splice(last.ix,0,last.item);}
    last=null;$('#note').hidden=true;persist();render();return;
  }
  if(act==='clear-ex'){
    Object.keys(S.months).forEach(function(k){var m=S.months[k];['income','fixed'].forEach(function(s){m[s]=m[s].filter(function(x){return !x.ex;});});});
    S.cards=S.cards.filter(function(x){return !x.ex;});S.consumos=S.consumos.filter(function(x){return !x.ex;});
    S.uber=S.uber.filter(function(x){return !x.ex;});S.debts=S.debts.filter(function(x){return !x.ex;});
    persist();render();note('Borré los ejemplos.');return;
  }
  if(act==='csv-month')return saveFile('cuentas-'+key+'.csv',csvMonth(),'text/csv');
  if(act==='csv-uber')return saveFile('uber.csv',csvUber(),'text/csv');
  if(act==='csv-debts')return saveFile('pagos-deudas.csv',csvDebts(),'text/csv');
  if(act==='csv-cons')return saveFile('consumos-tarjeta.csv',csvCons(),'text/csv');
  if(act==='json')return saveFile('respaldo-cuentas.json',JSON.stringify(S,null,2),'application/json');
  if(act==='close'){var ov=b.closest('.ov');if(ov)ov.remove();return;}
  if(act==='copy'){var ta=$('#ovta');(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject()).then(function(){note('Copiado.');},function(){ta.focus();ta.select();note('Seleccioná el texto y copialo.');});}
});

/* ---------- arranque ---------- */
(function(){var raw=null;try{raw=localStorage.getItem(LS);}catch(e){}
  try{S=raw?normalize(JSON.parse(raw)):null;}catch(e){S=null;}
  if(!S)S=normalize(emptyState());
  delete S._rs;})();
todayKey=periodKey(todayD);key=todayKey;
mo(key);render();setSave('Guardado');
(async function(){
  try{
    var c=window.claude;
    if(c&&c.use){
      var res=await Promise.all([c.use('db'),c.use('user')]);
      var id=res[1]?await res[1].id():null;
      if(res[0]&&id){
        dbRef=res[0];uid=id;
        var snap=await Promise.race([dbRef.collection('data/users/'+uid).doc('app').get(),new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},10000);})]);
        var data=snap&&snap.exists?snap.data():null;
        if(data&&num(data.t)>num(S.t)){S=normalize(JSON.parse(JSON.stringify(data)));delete S._rs;todayKey=periodKey(todayD);key=todayKey;try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}mo(key);render();}
        else dirty=true;
      }
    }
  }catch(e){dbRef=null;}
  loaded=true;
  if(dbRef&&dirty)flush();
})();
})();
</script>
